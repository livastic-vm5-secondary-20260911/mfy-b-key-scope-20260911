name: vm5-health-parent-binding-seed

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  seed-health-history:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Mergify Playwright sentinel
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
          PLAYWRIGHT_MERGIFY_INCLUDE_PROJECT_IN_TEST_NAME: 'true'
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
          mkdir -p vm5-test/tests
          cd vm5-test
          cat > package.json <<'EOP'
          {"name":"vm5-health-parent-binding","private":true,"devDependencies":{"@mergifyio/playwright":"0.3.7","@playwright/test":"1.62.1"}}
          EOP
          pnpm install --ignore-scripts --no-frozen-lockfile >/dev/null
          cat > playwright.config.mjs <<'EOC'
          import { defineConfig } from '@playwright/test';
          import { withMergify } from '@mergifyio/playwright';
          export default withMergify(defineConfig({testDir:'./tests',workers:1,projects:[{name:'chromium'}]}));
          EOC
          cat > tests/parent-binding.spec.mjs <<'EOT'
          import { test, expect } from '@mergifyio/playwright';
          test('VM5_B_PARENT_BINDING_VICTIM_260917_F19C', async () => {
            expect('victim-healthy').toBe('victim-healthy');
          });
          EOT
          pnpm exec playwright test --config playwright.config.mjs
