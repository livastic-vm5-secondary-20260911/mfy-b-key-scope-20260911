name: VM5 Qualified Deployment Inactive Probe
on:
  workflow_dispatch:
    inputs:
      mode:
        description: create-success or mark-inactive
        required: true
      environment:
        description: deployment environment
        required: false
      deployment_id:
        description: existing deployment id
        required: false
permissions:
  contents: read
  deployments: write
jobs:
  trusted-success:
    if: ${{ inputs.mode == 'create-success' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - run: echo "trusted deployment success"
  mark-inactive:
    if: ${{ inputs.mode == 'mark-inactive' }}
    runs-on: ubuntu-latest
    steps:
      - name: Mark trusted deployment inactive
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" \
            -f state=inactive >/dev/null
