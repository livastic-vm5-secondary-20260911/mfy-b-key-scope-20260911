pull_request_rules:
  - name: VM5_FRESH_CUSTOM_CONFIG_CHANGED_TRUE
    conditions:
      - mergify-configuration-changed
    actions:
      comment:
        message: VM5_FRESH_CUSTOM_CONFIG_CHANGED_TRUE
  - name: VM5_FRESH_CUSTOM_CONFIG_CHANGED_FALSE
    conditions:
      - -mergify-configuration-changed
    actions:
      comment:
        message: VM5_FRESH_CUSTOM_CONFIG_CHANGED_FALSE
